[package]
name = "roblox-asset-link"
version = "0.1.0"
edition = "2024"
license = "MIT"
autobins = false

[[bin]]
name = "roblox"
path = "src/cli.rs"

[[bin]]
name = "roblox-server"
path = "src/server.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
gltf = { version = "1.4", default-features = false, features = ["utils", "names"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tiny_http = "0.12"
uuid = { version = "1", features = ["v4"] }

tempfile = "3"
ufbx = "=0.11.4"
base64 = "0.22"
percent-encoding = "2"
parry3d = { version = "=0.31.1", features = ["enhanced-determinism"] }
image = { version = "=0.25.9", default-features = false, features = ["png", "jpeg", "bmp", "tga"] }
rbx_binary = "=3.0.0"
rbx_dom_weak = "=4.2.0"
rbx_reflection_database = { version = "=3.0.0", features = ["debug_always_use_bundled"] }

[dev-dependencies]
rbx_mesh = { version = "=0.7.0", default-features = false, features = ["mesh", "union-physics"] }
